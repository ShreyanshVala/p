<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let no = 121;
      let f = no;
      let rev = 0;
      while (no > 0) {
        let r = no % 10;
        no = Math.floor(no / 10);
        rev = rev * 10 + r;
      }
      document.write("<br>Reverse is" + rev);
      if (f == rev) {
        document.write("<br>It is palindrom No");
      } else {
        document.write("<br>It is Not palindrom No");
      }
    </script>
  </body>
</html>
