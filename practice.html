<!doctype html>
<html lang="en">
  <head>
    <title>Pattern</title>
  </head>
  <body>
    <script>
      for (let i = 5; i >= 1; i--) {
        for (let j = i; j <= 5; j++) {
          document.write(j);
        }
        document.write("<br>");
      }

      document.write("<hr>");

      let no = 1;

      for (let i = 1; i <= 4; i++) {
        for (let j = 1; j <= i; j++) {
          document.write(no + " ");
          no++;
        }
        document.write("<br>");
      }
    </script>
  </body>
</html>
