<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //exit controlled loop
      //condtition is wrong or right code will executed
      let i = 1;
      do {
        document.write("<br>" + i);
        i++;
      } while (i <= 5); //

      document.write("<hr>");
      //for(initialization,condition, increment,decrement)
      //entry controlled loop
      for (let j = 11, i = 100; j <= 15; j += 1, i -= 2) {
        document.write("<br>", j);
        document.write("<br> i is ", i);
      }
    </script>
  </body>
</html>
